<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>結果表示 | Sumikko Food Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #ffffff;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        header {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 300;
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 16px;
            font-weight: 300;
        }
        
        .nav {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .nav a {
            text-decoration: none;
            color: #333;
            padding: 12px 24px;
            border: 1px solid #ddd;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .nav a:hover {
            border-color: #333;
            background: #333;
            color: #fff;
        }
        
        .nav a.active {
            background: #333;
            color: #fff;
            border-color: #333;
        }
        
        .controls-section {
            background: #f9f9f9;
            padding: 30px;
            border-radius: 4px;
            margin-bottom: 40px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 20px;
            color: #333;
        }
        
        .control-group {
            margin-bottom: 20px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }
        
        .control-group select {
            width: 100%;
            max-width: 300px;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background: #fff;
        }
        
        .btn {
            padding: 10px 20px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            margin-right: 10px;
        }
        
        .btn:hover {
            border-color: #333;
        }
        
        .btn-primary {
            background: #333;
            color: #fff;
            border-color: #333;
        }
        
        .btn-primary:hover {
            background: #555;
        }
        
        .results-section {
            margin-bottom: 40px;
        }
        
        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        
        .results-table th,
        .results-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        .results-table th {
            background: #f9f9f9;
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }
        
        .results-table td {
            font-size: 14px;
        }
        
        .score-good {
            color: #27ae60;
            font-weight: 500;
        }
        
        .score-medium {
            color: #f39c12;
            font-weight: 500;
        }
        
        .score-bad {
            color: #e74c3c;
            font-weight: 500;
        }
        
        .chart-container {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 30px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .chart-container img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        
        .chart-info {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .no-results {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .message {
            padding: 15px 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        
        .message.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #f9f9f9;
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-card .label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .stat-card .value {
            font-size: 24px;
            font-weight: 500;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>結果表示</h1>
            <p class="subtitle">分析結果の確認と可視化</p>
        </header>
        
        <nav class="nav">
            <a href="/">ホーム</a>
            <a href="/settings">食器設定</a>
            <a href="/pipeline">パイプライン実行</a>
            <a href="/results" class="active">結果表示</a>
        </nav>
        
        <div class="controls-section">
            <div class="section-title">グラフ設定</div>
            
            <div class="control-group">
                <label>集計対象:</label>
                <select id="aggregationType">
                    <option value="all">全体</option>
                    <option value="by_tray">トレイ別</option>
                    <option value="by_plate">食器別</option>
                    <option value="by_tray_plate">トレイ×食器別</option>
                    <option value="by_nansai">軟菜/固体別</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>グラフタイプ:</label>
                <select id="chartType">
                    <option value="confusion">混同行列（デフォルト）</option>
                    <option value="scatter">散布図</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>トレイID:</label>
                <select id="traySelector">
                    <option value="all">全トレイ</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>食器名:</label>
                <select id="plateSelector">
                    <option value="all">全食器</option>
                </select>
            </div>
            
            <div class="control-group">
                <button class="btn btn-primary" onclick="loadAndRender()">グラフ更新</button>
                <button class="btn" onclick="clearCache()">キャッシュクリア</button>
            </div>
        </div>
        
        <div class="message" id="message"></div>
        
        <div id="resultsContent">
            <div class="loading">読み込み中...</div>
        </div>
    </div>
    
    <script>
        let analysisData = null;
        
        // 初期化
        async function init() {
            await loadResults();
            await loadAnalysisData();
            if (analysisData) {
                populateSelectors();
                renderStats();
                renderCharts();
            }
        }
        
        // 結果読み込み
        async function loadResults() {
            try {
                const response = await fetch('/api/step3/results');
                const data = await response.json();
                
                if (data.status === 'success') {
                    const results = data.results;
                    if (results.length === 0) {
                        showMessage('結果がありません。先にパイプラインを実行してください。', 'error');
                        return;
                    }
                    
                    renderResultsTable(results);
                } else {
                    showMessage('結果の取得に失敗しました', 'error');
                }
            } catch (error) {
                showMessage('エラー: ' + error.message, 'error');
            }
        }
        
        // 分析データ読み込み
        async function loadAnalysisData() {
            try {
                const response = await fetch('/api/step3/analysis-data');
                const data = await response.json();
                
                if (data.status === 'success') {
                    analysisData = data.data;
                } else {
                    showMessage('分析データの取得に失敗しました', 'error');
                }
            } catch (error) {
                showMessage('エラー: ' + error.message, 'error');
            }
        }
        
        // セレクタの設定
        function populateSelectors() {
            if (!analysisData) return;
            
            // トレイセレクタ
            const traySelector = document.getElementById('traySelector');
            traySelector.innerHTML = '<option value="all">全トレイ</option>';
            Object.keys(analysisData.by_tray).forEach(trayId => {
                const option = document.createElement('option');
                option.value = trayId;
                option.textContent = `トレイ${trayId}`;
                traySelector.appendChild(option);
            });
            
            // 食器セレクタ
            const plateSelector = document.getElementById('plateSelector');
            plateSelector.innerHTML = '<option value="all">全食器</option>';
            Object.keys(analysisData.by_plate).forEach(plateName => {
                const option = document.createElement('option');
                option.value = plateName;
                option.textContent = plateName;
                plateSelector.appendChild(option);
            });
        }
        
        // 統計情報の表示
        function renderStats() {
            if (!analysisData) return;
            
            const content = document.getElementById('resultsContent');
            
            const totalSamples = analysisData.all_data.length;
            const nansaiSamples = analysisData.by_nansai.nansai.length;
            const nonNansaiSamples = analysisData.by_nansai.non_nansai.length;
            const trayCount = Object.keys(analysisData.by_tray).length;
            const plateCount = Object.keys(analysisData.by_plate).length;
            
            content.innerHTML = `
                <div class="stats-summary">
                    <div class="stat-card">
                        <div class="label">総サンプル数</div>
                        <div class="value">${totalSamples}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">軟菜食サンプル</div>
                        <div class="value">${nansaiSamples}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">固体食サンプル</div>
                        <div class="value">${nonNansaiSamples}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">トレイ数</div>
                        <div class="value">${trayCount}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">食器種類数</div>
                        <div class="value">${plateCount}</div>
                    </div>
                </div>
                <div id="chartsContainer"></div>
            `;
        }
        
        // グラフ描画
        async function renderCharts() {
            if (!analysisData) return;
            
            const aggregationType = document.getElementById('aggregationType').value;
            const chartType = document.getElementById('chartType').value;
            const trayId = document.getElementById('traySelector').value;
            const plateName = document.getElementById('plateSelector').value;
            
            try {
                // トレイIDと食器名を両方送信
                const filterParams = [];
                if (trayId !== 'all') filterParams.push(`tray_id=${trayId}`);
                if (plateName !== 'all') filterParams.push(`plate_name=${plateName}`);
                
                const filterValue = filterParams.length > 0 ? filterParams.join('&') : 'all';
                
                const response = await fetch(`/api/step3/generate-charts?aggregation_type=${aggregationType}&${filterValue}&chart_type=${chartType}`);
                const data = await response.json();
                
                if (data.status === 'success') {
                    displayCharts(data.charts);
                } else {
                    showMessage('グラフの生成に失敗しました', 'error');
                }
            } catch (error) {
                showMessage('エラー: ' + error.message, 'error');
            }
        }
        
        // グラフ表示
        function displayCharts(charts) {
            const container = document.getElementById('chartsContainer');
            container.innerHTML = '';
            
            if (charts.length === 0) {
                container.innerHTML = '<div class="no-results">表示するグラフがありません</div>';
                return;
            }
            
            charts.forEach(chart => {
                const chartDiv = document.createElement('div');
                chartDiv.className = 'chart-container';
                chartDiv.innerHTML = `
                    <h3>${chart.title}</h3>
                    <img src="data:image/png;base64,${chart.image}" alt="${chart.title}">
                    <div class="chart-info">
                        <strong>R²:</strong> ${chart.r2.toFixed(4)} | 
                        <strong>MAE:</strong> ${chart.mae.toFixed(4)} | 
                        <strong>サンプル数:</strong> ${chart.sample_count}
                    </div>
                `;
                container.appendChild(chartDiv);
            });
        }
        
        // 結果テーブル描画
        function renderResultsTable(results) {
            let html = '<div class="results-section">';
            html += '<div class="section-title">食事量推定結果</div>';
            html += '<table class="results-table">';
            html += '<thead><tr><th>トレイID</th><th>食器名</th><th>R²スコア</th><th>MAE</th><th>評価</th></tr></thead>';
            html += '<tbody>';
            
            results.forEach(result => {
                const r2 = result.r2;
                const mae = result.mae;
                
                let scoreClass = 'score-bad';
                let evaluation = '要改善';
                
                if (r2 >= 0.8) {
                    scoreClass = 'score-good';
                    evaluation = '良好';
                } else if (r2 >= 0.5) {
                    scoreClass = 'score-medium';
                    evaluation = '普通';
                }
                
                html += `<tr>
                    <td>${result.plate_id}</td>
                    <td>${result.plate_name}</td>
                    <td class="${scoreClass}">${r2.toFixed(4)}</td>
                    <td>${mae.toFixed(4)}</td>
                    <td class="${scoreClass}">${evaluation}</td>
                </tr>`;
            });
            
            html += '</tbody></table>';
            html += '</div>';
            
            const content = document.getElementById('resultsContent');
            if (content.querySelector('.stats-summary')) {
                content.innerHTML = html + content.innerHTML;
            } else {
                content.innerHTML = html;
            }
        }
        
        // グラフ更新
        function loadAndRender() {
            if (!analysisData) {
                showMessage('分析データがありません。先にStep 3を実行してください。', 'error');
                return;
            }
            renderStats();
            renderCharts();
            showMessage('グラフを更新しました', 'success');
        }
        
        // キャッシュクリア
        async function clearCache() {
            try {
                const response = await fetch('/api/step3/clear-cache', {
                    method: 'POST'
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    showMessage('キャッシュをクリアしました', 'success');
                } else {
                    showMessage('キャッシュクリアに失敗しました', 'error');
                }
            } catch (error) {
                showMessage('エラー: ' + error.message, 'error');
            }
        }
        
        // メッセージ表示
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
            
            setTimeout(() => {
                message.style.display = 'none';
            }, 3000);
        }
        
        // イベントリスナー
        document.getElementById('aggregationType').addEventListener('change', function() {
            // セレクタは常に有効にする
            const traySelector = document.getElementById('traySelector');
            const plateSelector = document.getElementById('plateSelector');
            
            traySelector.disabled = false;
            plateSelector.disabled = false;
        });
        
        // 初期化実行
        init();
    </script>
</body>
</html>
