<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食器設定 | Sumikko Food Analysis</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #ffffff;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        header {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 300;
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 16px;
            font-weight: 300;
        }
        
        .nav {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .nav a {
            text-decoration: none;
            color: #333;
            padding: 12px 24px;
            border: 1px solid #ddd;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .nav a:hover {
            border-color: #333;
            background: #333;
            color: #fff;
        }
        
        .nav a.active {
            background: #333;
            color: #fff;
            border-color: #333;
        }
        
        .controls-section {
            margin-bottom: 40px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 20px;
            color: #333;
        }
        
        .tray-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .tray-btn {
            padding: 10px 20px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .tray-btn:hover {
            border-color: #333;
        }
        
        .tray-btn.active {
            background: #333;
            color: #fff;
            border-color: #333;
        }
        
        .plate-settings {
            border: 1px solid #eee;
            border-radius: 4px;
            padding: 30px;
        }
        
        .plate-row {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 150px;
            gap: 20px;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }
        
        .plate-row:last-child {
            border-bottom: none;
        }
        
        .plate-row .label {
            font-size: 14px;
            color: #666;
        }
        
        .plate-row select,
        .plate-row input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            width: 100%;
        }
        
        .plate-row input[type="checkbox"] {
            width: auto;
        }
        
        .preview-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .preview-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border: 1px solid #eee;
            border-radius: 4px;
            background: #f9f9f9;
        }
        
        .preview-image.error {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 12px;
        }
        
        .btn {
            padding: 10px 20px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        
        .btn:hover {
            border-color: #333;
        }
        
        .btn-primary {
            background: #333;
            color: #fff;
            border-color: #333;
        }
        
        .btn-primary:hover {
            background: #555;
        }
        
        .message {
            padding: 15px 20px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.success {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        
        .message.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>食器設定</h1>
            <p class="subtitle">食器の種類や軟菜フラグを設定します</p>
        </header>
        
        <nav class="nav">
            <a href="/">ホーム</a>
            <a href="/settings" class="active">食器設定</a>
            <a href="/pipeline">パイプライン実行</a>
            <a href="/results">結果表示</a>
        </nav>
        
        <div class="controls-section">
            <div class="section-title">トレイ選択</div>
            <div class="tray-selector" id="traySelector">
                <div class="loading">読み込み中...</div>
            </div>
        </div>
        
        <div class="plate-settings" id="plateSettings">
            <div class="loading">トレイを選択してください</div>
        </div>
        
        <div class="message" id="message"></div>
    </div>
    
    <script>
        let currentTrayId = null;
        
        async function loadTrayIds() {
            try {
                const response = await fetch('/api/tray-ids');
                const data = await response.json();
                
                const selector = document.getElementById('traySelector');
                selector.innerHTML = '';
                
                data.tray_ids.forEach(trayId => {
                    const btn = document.createElement('button');
                    btn.className = 'tray-btn';
                    btn.textContent = `トレイ${trayId}`;
                    btn.onclick = () => selectTray(trayId);
                    selector.appendChild(btn);
                });
            } catch (error) {
                showMessage('トレイIDの取得に失敗しました', 'error');
            }
        }
        
        async function selectTray(trayId) {
            currentTrayId = trayId;
            
            // ボタンのスタイル更新
            document.querySelectorAll('.tray-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === `トレイ${trayId}`) {
                    btn.classList.add('active');
                }
            });
            
            await loadPlateSettings(trayId);
        }
        
        async function loadPlateSettings(trayId) {
            try {
                const response = await fetch(`/api/plate-settings`);
                const data = await response.json();
                
                if (data.status === 'success' && data.settings[trayId]) {
                    renderPlateSettings(trayId, data.settings[trayId]);
                } else {
                    document.getElementById('plateSettings').innerHTML = '<div class="no-data">設定が見つかりません</div>';
                }
            } catch (error) {
                showMessage('設定の取得に失敗しました', 'error');
            }
        }
        
        function renderPlateSettings(trayId, settings) {
            const container = document.getElementById('plateSettings');
            
            let html = '<div class="section-title">食器設定</div>';
            html += '<div class="plate-row">';
            html += '<div class="label">番号</div>';
            html += '<div class="label">食器名</div>';
            html += '<div class="label">軟菜</div>';
            html += '<div class="label">プレビュー</div>';
            html += '</div>';
            
            settings.forEach((setting, index) => {
                html += '<div class="plate-row">';
                html += `<div class="label">${index}</div>`;
                html += `<select id="plateName_${index}" onchange="updateSetting(${index})">`;
                html += `<option value="${setting.plate_name}">${setting.plate_name}</option>`;
                html += '</select>';
                html += `<input type="checkbox" id="nansai_${index}" ${setting.nansai ? 'checked' : ''} onchange="updateSetting(${index})">`;
                html += `<div class="preview-container">`;
                html += `<img src="/plate_images/${trayId}/plate_${index}.png" class="preview-image" onerror="this.style.display='none'">`;
                html += `<div class="preview-image error" id="previewError_${index}">N/A</div>`;
                html += '</div>';
                html += '</div>';
            });
            
            html += '<div style="margin-top: 30px;">';
            html += '<button class="btn btn-primary" onclick="saveSettings()">設定を保存</button>';
            html += '</div>';
            
            container.innerHTML = html;
            
            // プレビュー画像の確認
            settings.forEach((setting, index) => {
                const img = document.getElementById(`plateName_${index}`).parentElement.parentElement.querySelector('img');
                const errorDiv = document.getElementById(`previewError_${index}`);
                
                img.onload = function() {
                    errorDiv.style.display = 'none';
                    img.style.display = 'block';
                };
                
                img.onerror = function() {
                    img.style.display = 'none';
                    errorDiv.style.display = 'flex';
                };
            });
        }
        
        async function updateSetting(index) {
            const plateName = document.getElementById(`plateName_${index}`).value;
            const nansai = document.getElementById(`nansai_${index}`).checked;
            
            try {
                const response = await fetch(`/api/plate-settings/${currentTrayId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        plate_number: index,
                        plate_name: plateName,
                        nansai: nansai
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    showMessage('設定を更新しました', 'success');
                } else {
                    showMessage('設定の更新に失敗しました', 'error');
                }
            } catch (error) {
                showMessage('エラー: ' + error.message, 'error');
            }
        }
        
        async function saveSettings() {
            showMessage('設定はリアルタイムで保存されています', 'success');
        }
        
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
            
            setTimeout(() => {
                message.style.display = 'none';
            }, 3000);
        }
        
        // 初期化
        loadTrayIds();
    </script>
</body>
</html>
